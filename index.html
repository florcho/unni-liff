    <div class="msg" id="msg">載入中… · 로딩 중…</div>
  </div>
<script>
  var LIFF_ID="2010909878-w45QPkcJ";
  var EXEC="https://script.google.com/macros/s/AKfycbwIvZ_Oq8SCzbk4rXIUN58Arlk5lX0Q73F0nGUdXDj1DNoeJpS6VRQX65sgPBTvMF2O/exec";
  function qp(name){
    var s=location.search.substring(1)+"&"+location.hash.substring(1);
    var re=new RegExp("(?:^|&)"+name.replace(/[.]/g,"\\.")+"=([^&]*)");
    var m=s.match(re); return m?decodeURIComponent(m[1]):"";
  }
  // 토큰: ?token= 우선, 없으면 liff.state 안(?token=..)에서, 그래도 없으면 URL 전체 스캔
  function getToken(){
    var t=qp("token"); if(t) return t;
    var ls=qp("liff.state"); if(ls){ var m=ls.match(/token=([A-Za-z0-9]+)/); if(m) return m[1]; }
    var m2=location.href.match(/token(?:=|%3D)([A-Za-z0-9]+)/); return m2?m2[1]:"";
  }
  var token=getToken(), moved=false;
  function go(uid,name){
    if(moved) return; moved=true;
    var u=EXEC+"?token="+encodeURIComponent(token||"");
    if(uid) u+="&lineUid="+encodeURIComponent(uid)+"&lineName="+encodeURIComponent(name||"");
    location.replace(u);
  }
  // 안전장치: 6초 안에 프로필 못 얻어도 토큰만으로 개인화 페이지로 진행
  setTimeout(function(){ go("",""); }, 6000);
  try{
    liff.init({liffId:LIFF_ID}).then(function(){
      liff.getProfile().then(function(p){ go(p&&p.userId, p&&p.displayName); })
                       .catch(function(){ go("",""); });
    }).catch(function(){ go("",""); });
  }catch(e){ go("",""); }
</script>
</body>
</html>
